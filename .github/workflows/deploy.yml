name: Build and Deploy (Onay Consulting)

on:
  push:
    branches:
      - onayconsulting 

env:
  APP_NAME: onayconsulting-admin
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase IMAGE_NAME
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image
        run: |
          docker build --cache-from $IMAGE_NAME:latest \
            -t $IMAGE_NAME:$IMAGE_TAG \
            --build-arg REACT_APP_API_URL=//api.onayconsulting.az/api/v1/ . 
          docker push $IMAGE_NAME:$IMAGE_TAG
          docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:latest
          docker push $IMAGE_NAME:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.onayconsulting.az 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase IMAGE_NAME
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Prepare docker-compose file
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ssh_key
          chmod 400 ssh_key
          # docker-compose.yml faylında $IMAGE_NAME və $IMAGE_TAG dəyişənləri olmalıdır
          envsubst '$IMAGE_NAME $IMAGE_TAG' < docker-compose.yml > docker-compose.processed.yml

      - name: Copy files to remote server
        run: |
          # DİQQƏT: root əvəzinə deployuser və yeni qovluq yolu
          ssh -o StrictHostKeyChecking=no -i ssh_key deployuser@${{ secrets.HOST_IP }} "mkdir -p /home/deployuser/apps/${{ env.APP_NAME }}"
          
          scp -o StrictHostKeyChecking=no -i ssh_key docker-compose.processed.yml deployuser@${{ secrets.HOST_IP }}:/home/deployuser/apps/${{ env.APP_NAME }}/docker-compose.yml
          
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
            scp -o StrictHostKeyChecking=no -i ssh_key .env deployuser@${{ secrets.HOST_IP }}:/home/deployuser/apps/${{ env.APP_NAME }}/.env
          fi

      - name: Deploy on remote server
        run: |
          ssh -o StrictHostKeyChecking=no -i ssh_key deployuser@${{ secrets.HOST_IP }} "
          cd /home/deployuser/apps/${{ env.APP_NAME }}
          
          # Serverdə Login
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # Yeniləmə prosesi
          docker compose down
          docker compose up -d
          
          # Təmizlik
          docker image prune -af"