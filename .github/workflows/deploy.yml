name: Build and Deploy (Onay Consulting Admin)

on:
  push:
    branches:
      - onayconsulting

env:
  APP_NAME: onayconsulting-admin
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase IMAGE_NAME
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image
        run: |
          docker build --cache-from $IMAGE_NAME:latest \
            -t $IMAGE_NAME:$IMAGE_TAG \
            --build-arg REACT_APP_API_URL=https://api.onayconsulting.az/api/v1/ . 
          docker push $IMAGE_NAME:$IMAGE_TAG
          docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:latest
          docker push $IMAGE_NAME:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.onayconsulting.az
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase IMAGE_NAME
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Prepare SSH Key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ssh_key
          chmod 400 ssh_key

      - name: Copy files to remote server
        run: |
          # 1. Qovluğu yarat
          ssh -o StrictHostKeyChecking=no -i ssh_key deployuser@${{ secrets.HOST_IP }} "mkdir -p /home/deployuser/apps/${{ env.APP_NAME }}"
          
          # 2. docker-compose.yml faylını olduğu kimi at (envsubst lazım deyil)
          scp -o StrictHostKeyChecking=no -i ssh_key docker-compose.yml deployuser@${{ secrets.HOST_IP }}:/home/deployuser/apps/${{ env.APP_NAME }}/docker-compose.yml
          
          # 3. .env faylını serverdə YARADIRIQ (Image adını içinə yazırıq)
          ssh -o StrictHostKeyChecking=no -i ssh_key deployuser@${{ secrets.HOST_IP }} "echo 'IMAGE_NAME=${{ env.IMAGE_NAME }}' > /home/deployuser/apps/${{ env.APP_NAME }}/.env && echo 'IMAGE_TAG=${{ env.IMAGE_TAG }}' >> /home/deployuser/apps/${{ env.APP_NAME }}/.env"
          
          # 4. Əlavə Secret-ləri (əgər varsa) də .env-ə əlavə edirik
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
             echo "${{ secrets.ENV_FILE }}" >> extra_env.txt
             scp -o StrictHostKeyChecking=no -i ssh_key extra_env.txt deployuser@${{ secrets.HOST_IP }}:/home/deployuser/apps/${{ env.APP_NAME }}/extra_env.txt
             ssh -o StrictHostKeyChecking=no -i ssh_key deployuser@${{ secrets.HOST_IP }} "cat /home/deployuser/apps/${{ env.APP_NAME }}/extra_env.txt >> /home/deployuser/apps/${{ env.APP_NAME }}/.env && rm /home/deployuser/apps/${{ env.APP_NAME }}/extra_env.txt"
          fi

      - name: Deploy on remote server
        run: |
          ssh -o StrictHostKeyChecking=no -i ssh_key deployuser@${{ secrets.HOST_IP }} "
          cd /home/deployuser/apps/${{ env.APP_NAME }}
          
          # Login
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # Restart
          docker compose down
          docker compose up -d
          docker image prune -af"