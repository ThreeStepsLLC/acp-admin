name: Build and Deploy (Onay Consulting Admin)

on:
  push:
    branches:
      - onayconsulting

env:
  APP_NAME: onayconsulting-admin
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase IMAGE_NAME
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image
        env:
          REACT_APP_API_URL: https://api.onayconsulting.az/api/v1/
          REACT_APP_BASE_URL: https://api.onayconsulting.az
        run: |
          echo "🔨 Building Docker image with build args:"
          echo "  REACT_APP_API_URL=$REACT_APP_API_URL"
          echo "  REACT_APP_BASE_URL=$REACT_APP_BASE_URL"
          
          docker build \
            --cache-from $IMAGE_NAME:latest \
            --build-arg REACT_APP_API_URL=$REACT_APP_API_URL \
            --build-arg REACT_APP_BASE_URL=$REACT_APP_BASE_URL \
            -t $IMAGE_NAME:$IMAGE_TAG \
            . 
          
          echo "✅ Build completed successfully"
          echo "📤 Pushing image: $IMAGE_NAME:$IMAGE_TAG"
          
          docker push $IMAGE_NAME:$IMAGE_TAG
          docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:latest
          docker push $IMAGE_NAME:latest
          
          echo "✅ Image pushed successfully"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.onayconsulting.az
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase IMAGE_NAME
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Prepare SSH key
        run: |
          echo "${{ secrets.ONAY_SSH_PRIVATE_KEY }}" > ssh_key
          chmod 600 ssh_key

      - name: Copy files to remote server
        run: |
          ssh -o StrictHostKeyChecking=no -i ssh_key deployuser@${{ secrets.ONAY_HOST_IP }} "mkdir -p /home/deployuser/apps/${{ env.APP_NAME }}"
          
          # Create .env file with IMAGE_NAME and IMAGE_TAG
          echo "IMAGE_NAME=$IMAGE_NAME" > .env.deploy
          echo "IMAGE_TAG=$IMAGE_TAG" >> .env.deploy
          
          scp -o StrictHostKeyChecking=no -i ssh_key docker-compose.yml deployuser@${{ secrets.ONAY_HOST_IP }}:/home/deployuser/apps/${{ env.APP_NAME }}/docker-compose.yml
          scp -o StrictHostKeyChecking=no -i ssh_key .env.deploy deployuser@${{ secrets.ONAY_HOST_IP }}:/home/deployuser/apps/${{ env.APP_NAME }}/.env
          
      - name: Deploy on remote server
        run: |
          ssh -o StrictHostKeyChecking=no -i ssh_key deployuser@${{ secrets.ONAY_HOST_IP }} "
          cd /home/deployuser/apps/${{ env.APP_NAME }}
          
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # Stop and remove old containers
          docker compose down
          
          # Pull new image
          docker compose pull
          
          # Start with new image
          docker compose up -d --remove-orphans --force-recreate
          
          echo '=== Container Status ==='
          docker compose ps
          
          echo '=== Recent Logs ==='
          docker compose logs --tail=50
          
          docker image prune -af"