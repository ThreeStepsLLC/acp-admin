name: Build and Deploy! (Onay Consulting)

on:
  push:
    branches:
      - onayconsulting

env:
  APP_NAME: onayconsulting-admin
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase IMAGE_NAME
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image
        run: |
          docker build --cache-from $IMAGE_NAME:latest \
            -t $IMAGE_NAME:$IMAGE_TAG \
            --build-arg REACT_APP_API_URL=//api.onayconsulting.az/api/v1/ .
          docker push $IMAGE_NAME:$IMAGE_TAG
          docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:latest
          docker push $IMAGE_NAME:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.onayconsulting.az 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase IMAGE_NAME
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Prepare SSH key
        run: |
          echo "${{ secrets.ONAY_SSH_PRIVATE_KEY }}" > ssh_key
          chmod 600 ssh_key

      - name: Copy files to remote server
        run: |
          ssh -o StrictHostKeyChecking=no -i ssh_key deployuser@${{ secrets.ONAY_HOST_API }} "mkdir -p /home/deployuser/apps/${{ env.APP_NAME }}"
          
          scp -o StrictHostKeyChecking=no -i ssh_key docker-compose.yml deployuser@${{ secrets.ONAY_HOST_API }}:/home/deployuser/apps/${{ env.APP_NAME }}/docker-compose.yml
          
          echo "${{ secrets.ONAY_ENV_FILE }}" > .env.production
          scp -o StrictHostKeyChecking=no -i ssh_key .env.production deployuser@${{ secrets.ONAY_HOST_API }}:/home/deployuser/apps/${{ env.APP_NAME }}/.env

      - name: Deploy on remote server
        run: |
          ssh -o StrictHostKeyChecking=no -i ssh_key deployuser@${{ secrets.ONAY_HOST_API }} "
          cd /home/deployuser/apps/${{ env.APP_NAME }}
          
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          docker compose pull
          docker compose up -d --remove-orphans
          
          echo '=== Container Status ==='
          docker compose ps
          
          echo '=== Recent Logs ==='
          docker compose logs --tail=50
          
          docker image prune -af"